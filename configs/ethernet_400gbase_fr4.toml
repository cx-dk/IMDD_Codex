drive_vpp = 1.0
vpi_v = 2.0
bias_phase_rad = 0.7853981633974483
chirp = 0.0
extinction_ratio_db = 6.0

[transmitter.laser]
wavelength_nm = 1311.0
power_dbm = 3.0
rin_db_hz = -145.0
